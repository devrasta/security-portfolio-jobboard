services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobboard_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
      POSTGRES_DB: ${POSTGRES_DB:-jobboard_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-jobboard_user} -d ${POSTGRES_DB:-jobboard_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - jobboard

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3002
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5174}
      DATABASE_URL: postgresql://${POSTGRES_USER:-jobboard_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jobboard_db}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file (min 32 chars)}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in your .env file (min 32 chars)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in your .env file (64 hex chars)}
      COOKIE_SECRET: ${COOKIE_SECRET:?Set COOKIE_SECRET in your .env file}
    ports:
      - "${API_PORT:-3002}:3002"
    networks:
      - jobboard

  front:
    build:
      context: .
      dockerfile: apps/front/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3002}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONT_PORT:-5174}:80"
    networks:
      - jobboard

volumes:
  postgres_data:

networks:
  jobboard:
    driver: bridge
