services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - apps/api/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - jobboard

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - apps/api/.env
    ports:
      - "${API_PORT:-3002}:3002"
    networks:
      - jobboard

  front:
    build:
      context: .
      dockerfile: apps/front/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3002}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONT_PORT:-5174}:8080"
    networks:
      - jobboard

volumes:
  postgres_data:

networks:
  jobboard:
    driver: bridge
